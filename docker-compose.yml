version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledgebot-app
    # Using host network mode allows both containers to communicate via 'localhost'
    # seamlessly, which is required because the whatsapp-bridge code has localhost:3003 hardcoded.
    network_mode: "host"
    restart: always
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3003
      - HOSTNAME=0.0.0.0
      # Puente unico de TODAS las lineas: Baileys, en el 3005. Este valor pisa
      # al de .env.production, asi que es el que manda. Antes apuntaba al 3004
      # (whatsapp-web.js), cuyo almacen interno quedo roto contra la version
      # actual de WhatsApp Web: fallaban la descarga de adjuntos y hasta el
      # listado de chats, y no tiene arreglo desde aqui.
      - WHATSAPP_BRIDGE_URL=http://localhost:3005
      - VOLUME_PATH=/data
    volumes:
      - ./attachments:/data/attachments
      - ./catalogo_catalogospromocionales/imagenes_productos:/data/imagenes_productos
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  whatsapp-bridge:
    build:
      context: ./wa-server
      dockerfile: Dockerfile
    container_name: knowledgebot-wa-bridge
    init: true
    network_mode: "host"
    restart: always
    env_file:
      - .env.production
    environment:
      - APP_URL=http://localhost:3003
      # ARQUITECTURA (31-Jul-2026): UN SOLO PUENTE PARA TODAS LAS LINEAS.
      #
      # Aqui vivian BRIDGE_LINES=linea_1,linea_2 y
      # FORWARD_INBOUND_LINES=linea_1,linea_2, que repartian las lineas entre
      # este puente y el de Baileys. Se quitan a proposito: al enumerar las
      # lineas una por una, cualquier linea NUEVA que se conectara (linea_3, o
      # la de un cliente de otro pais) quedaba fuera de la lista y el puente la
      # ignoraba en silencio. No escala a 8 lineas ni a clientes nuevos.
      #
      # Sin definir, las dos compuertas se abren para TODAS las lineas, que es
      # el valor por defecto del codigo (ownsLine y reenviaEntrantes devuelven
      # true con la lista vacia). Se conservan en el codigo por si alguna vez
      # hace falta repartir carga, pero el sistema NO depende de ellas.
      #
      # Version de WhatsApp Web fijada. Con la ultima version que sirve
      # WhatsApp, whatsapp-web.js 1.34.7 no encuentra sus funciones internas y
      # fallan la descarga de adjuntos y hasta el listado de chats con un
      # `[Error] r`. Si WhatsApp vuelve a romperla, se cambia este valor por
      # otro de https://github.com/wppconnect-team/wa-version (carpeta html),
      # sin tocar codigo.
      - WA_WEB_VERSION=2.3000.1040516757-alpha
    volumes:
      - ./wwebjs_sessions:/data/wwebjs_sessions
      - ./wa-server/.wwebjs_cache:/app/.wwebjs_cache
    # Chrome needs system capabilities for sandboxing inside Docker
    cap_add:
      - SYS_ADMIN
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # Puente Baileys (30-Jul-2026)
  #
  # POR QUE EXISTE: el puente whatsapp-web.js de arriba no puede descargar la
  # media entrante. Medido sobre los ultimos 328 mensajes entrantes de
  # produccion: 0 archivos descargados, 9 con mediaError. Es un bug de la
  # libreria, no se arregla desde la app. Baileys si descarga, y ademas no
  # necesita Chrome, asi que este contenedor es mucho mas liviano.
  #
  # Las lineas se migran de UNA EN UNA con BRIDGE_LINES, y la app decide a
  # que puente hablarle con WHATSAPP_BRIDGE_ROUTES en .env.production.
  #
  # FORWARDING_ENABLED=false es el modo sombra: se conecta y descarga, pero no
  # le manda nada a la app. Permite comprobar que la descarga funciona con la
  # linea todavia atendida por el puente viejo, sin duplicar respuestas.
  # ============================================================
  whatsapp-bridge-baileys:
    build:
      context: ./wa-server-baileys
      dockerfile: Dockerfile
    container_name: knowledgebot-wa-bridge-baileys
    init: true
    network_mode: "host"
    restart: always
    env_file:
      - .env.production
    environment:
      - PORT=3005
      - APP_URL=http://localhost:3003
      - VOLUME_PATH=/data
      # Sin BRIDGE_LINES: este puente atiende TODAS las lineas, las de hoy y
      # las que se conecten manana. Antes decia `linea_2`, lo que dejaba fuera
      # en silencio a cualquier linea nueva.
      # true = atiende de verdad: reenvia los mensajes a la app y le informa
      # del QR y del estado al panel. Con false se queda en modo sombra.
      - FORWARDING_ENABLED=true
    volumes:
      # Credenciales de sesion: borrarlas obliga a escanear un QR nuevo.
      - ./baileys_sessions:/data/baileys_sessions
      # Historial acumulado en disco, para responder a /history.
      - ./baileys_store:/data/baileys_store
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
