version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledgebot-app
    # Using host network mode allows both containers to communicate via 'localhost'
    # seamlessly, which is required because the whatsapp-bridge code has localhost:3003 hardcoded.
    network_mode: "host"
    restart: always
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3003
      - HOSTNAME=0.0.0.0
      - WHATSAPP_BRIDGE_URL=http://localhost:3004
      - VOLUME_PATH=/data
    volumes:
      - ./attachments:/data/attachments
      - ./catalogo_catalogospromocionales/imagenes_productos:/data/imagenes_productos
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  whatsapp-bridge:
    build:
      context: ./wa-server
      dockerfile: Dockerfile
    container_name: knowledgebot-wa-bridge
    init: true
    network_mode: "host"
    restart: always
    env_file:
      - .env.production
    environment:
      - APP_URL=http://localhost:3003
      # ARQUITECTURA FINAL (31-Jul-2026): cada linea usa LOS DOS puentes.
      # Este puente ENVIA en las dos lineas, porque es el unico que entrega:
      # Baileys es rechazado por WhatsApp en el acuse con error 463.
      - BRIDGE_LINES=linea_1,linea_2
      # ...pero solo REENVIA lo que recibe de las lineas que aun no recibe
      # Baileys. Si reenviara una que ya recibe el otro puente, el agente
      # correria dos veces y el cliente veria cada respuesta duplicada.
      # Fase 1: linea_2 ya recibe por Baileys; linea_1 todavia no.
      - FORWARD_INBOUND_LINES=linea_1,linea_2
    volumes:
      - ./wwebjs_sessions:/data/wwebjs_sessions
      - ./wa-server/.wwebjs_cache:/app/.wwebjs_cache
    # Chrome needs system capabilities for sandboxing inside Docker
    cap_add:
      - SYS_ADMIN
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # Puente Baileys (30-Jul-2026)
  #
  # POR QUE EXISTE: el puente whatsapp-web.js de arriba no puede descargar la
  # media entrante. Medido sobre los ultimos 328 mensajes entrantes de
  # produccion: 0 archivos descargados, 9 con mediaError. Es un bug de la
  # libreria, no se arregla desde la app. Baileys si descarga, y ademas no
  # necesita Chrome, asi que este contenedor es mucho mas liviano.
  #
  # Las lineas se migran de UNA EN UNA con BRIDGE_LINES, y la app decide a
  # que puente hablarle con WHATSAPP_BRIDGE_ROUTES en .env.production.
  #
  # FORWARDING_ENABLED=false es el modo sombra: se conecta y descarga, pero no
  # le manda nada a la app. Permite comprobar que la descarga funciona con la
  # linea todavia atendida por el puente viejo, sin duplicar respuestas.
  # ============================================================
  whatsapp-bridge-baileys:
    build:
      context: ./wa-server-baileys
      dockerfile: Dockerfile
    container_name: knowledgebot-wa-bridge-baileys
    init: true
    network_mode: "host"
    restart: always
    env_file:
      - .env.production
    environment:
      - PORT=3005
      - APP_URL=http://localhost:3003
      - VOLUME_PATH=/data
      - BRIDGE_LINES=linea_2
      # true = atiende de verdad: reenvia los mensajes a la app y le informa
      # del QR y del estado al panel. Con false se queda en modo sombra.
      - FORWARDING_ENABLED=true
    volumes:
      # Credenciales de sesion: borrarlas obliga a escanear un QR nuevo.
      - ./baileys_sessions:/data/baileys_sessions
      # Historial acumulado en disco, para responder a /history.
      - ./baileys_store:/data/baileys_store
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
